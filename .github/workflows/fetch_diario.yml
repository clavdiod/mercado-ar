name: Check TC BNA

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 15-23 * * *"

permissions:
  contents: write  # 🔑 esto le da permiso al robot para subir archivos

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run script
        run: |
          python scripts/check_tc.py || echo "Error en ejecución, continuar..."
      - name: Save historico
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/*
          git commit -m "Update historico"
          git push

name: Fetch precios diarios

on:
  schedule:
    - cron: "0 11 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests --quiet

      - name: Ejecutar fetch de precios
        run: python scripts/fetch_precios.py

      - name: Commit y push de datos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "datos: precios $(date -u +%Y-%m-%d)"
          git push
